[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regimekit"
version = "0.1.0.dev0"
description = "JAX-based Hidden Semi-Markov Model framework for market-regime detection and probabilistic return forecasting."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "jax>=0.11",
  "equinox>=0.13",
  "optax>=0.2.8",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=25",
  "pydantic>=2.13",
  "ruamel.yaml>=0.18",
  "typer>=0.15",
  "structlog>=25",
  "jaxtyping>=0.3",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.11"]
providers = ["yfinance>=1.7", "curl_cffi>=0.15", "pandas-datareader>=0.10", "fredapi>=0.5"]
mcmc = ["numpyro>=0.20"]

[dependency-groups]
dev = [
  "pytest>=9",
  "pytest-cov",
  "pytest-xdist",
  "pytest-benchmark",
  "hypothesis>=6.163",
  "beartype",
  "ruff>=0.16",
  "mypy>=2.1",
  "pre-commit",
  "nox",
  "scipy>=1.15",
  "mkdocs-material>=9.7",
  "mkdocstrings[python]",
]

[project.scripts]
regimekit = "regimekit.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regimekit"]
